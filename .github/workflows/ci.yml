name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NX_DAEMON: 'false'
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Nx comparison range
        id: nx-range
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Print Nx version
        run: pnpm nx --version

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint affected projects
        run: pnpm nx affected -t lint --parallel --base=${{ steps.nx-range.outputs.base }} --head=${{ steps.nx-range.outputs.head }}

      - name: Test all library projects
        run: pnpm nx run-many -t test --projects="tag:nx:lib" --parallel

      - name: Type-check all projects that provide the target
        run: pnpm nx run-many -t type-check --all --parallel

      - name: Run Astro checks for affected projects
        run: pnpm nx affected -t check --parallel --base=${{ steps.nx-range.outputs.base }} --head=${{ steps.nx-range.outputs.head }}

      - name: Build affected projects
        run: pnpm nx affected -t build --parallel --base=${{ steps.nx-range.outputs.base }} --head=${{ steps.nx-range.outputs.head }}

      - name: Verify generated project
        run: pnpm run verify:generated-app

      - name: Verify packed packages and exports
        run: pnpm run verify:packages
